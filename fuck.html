<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3anteel El IG · IGCSE Maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a1519; --panel:#101f25; --panel-2:#142b32; --line:#1f3a42;
  --teal:#0f3a42; --gold:#f2b632; --gold-soft:#ffd976; --gold-deep:#b98512;
  --text:#eaf1ee; --muted:#8da3a6; --danger:#ff7a6b; --ok:#5ed6a0;
  --r-lg:20px; --r-md:12px; --r-sm:8px;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font:400 15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;line-height:1.15}
button,input,select{font:inherit;color:inherit}
a{color:var(--gold-soft)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);padding:9px 16px;border-radius:var(--r-sm);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--gold-deep);background:#18343c}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#2a1e00;border-color:var(--gold);box-shadow:0 6px 24px -8px rgba(242,182,50,.55)}
.btn.primary:hover{background:linear-gradient(180deg,#ffe6a3,var(--gold-soft))}
.btn.danger{color:var(--danger);border-color:rgba(255,122,107,.35);background:transparent}
.btn.danger:hover{background:rgba(255,122,107,.1);border-color:var(--danger)}
.btn.small{padding:5px 10px;font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:13.5px;color:var(--muted);font-weight:500}
.input,select.input{width:100%;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;transition:border-color .15s;font-family:inherit;font-size:inherit}
.input:focus{border-color:var(--gold);outline:none}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.msg{padding:10px 13px;border-radius:var(--r-sm);font-size:14px;margin-bottom:14px}
.msg.error{background:rgba(255,122,107,.1);border:1px solid rgba(255,122,107,.35);color:#ffb3a9}
.msg.ok{background:rgba(94,214,160,.1);border:1px solid rgba(94,214,160,.35);color:#a4efcc}

/* auth view */
#auth-view{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.auth-brand{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px;background:radial-gradient(90% 70% at 50% 35%,#123c45 0%,var(--ink) 70%)}
.auth-brand svg.graph{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.auth-brand .logo-big{position:relative;width:min(340px,70%);filter:drop-shadow(0 20px 50px rgba(242,182,50,.28))}
.auth-brand h1{position:relative;font-size:clamp(28px,3.2vw,44px);text-align:center;margin-top:20px;font-weight:800}
.auth-brand p{position:relative;color:var(--muted);text-align:center;max-width:36ch;margin-top:10px}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--ink)}
.auth-card{width:100%;max-width:400px}
.auth-card h2{font-size:28px;margin-bottom:6px}
.auth-card .sub{color:var(--muted);margin-bottom:22px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:var(--r-md);margin-bottom:24px}
.tabs button{flex:1;background:none;border:0;padding:9px;border-radius:var(--r-sm);cursor:pointer;color:var(--muted);font-weight:600}
.tabs button.active{background:var(--panel-2);color:var(--gold-soft)}

/* app shell */
#app-view{display:grid;grid-template-columns:260px 1fr;min-height:100%}
.sidebar{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:20px}
.sidebar .logo{width:150px;margin:0 auto;display:block}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:11px 14px;border-radius:var(--r-md);cursor:pointer;color:var(--muted);font-weight:600;text-align:left}
.nav button:hover{background:var(--panel-2);color:var(--text)}
.nav button.active{background:var(--teal);color:var(--gold-soft);box-shadow:inset 3px 0 0 var(--gold)}
.nav svg{width:19px;height:19px;flex:none}
.nav .group{font-size:13px;color:var(--muted);padding:14px 14px 4px;opacity:.75}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:16px}
.me .email{font-size:13px;color:var(--muted);word-break:break-all;margin:6px 0 12px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--teal);color:var(--gold-soft);border:1px solid var(--line)}
.chip.founder{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#2a1e00;border-color:var(--gold)}
.chip.banned{background:rgba(255,122,107,.12);color:var(--danger);border-color:rgba(255,122,107,.4)}
.chip.ok{background:rgba(94,214,160,.1);color:var(--ok);border-color:rgba(94,214,160,.35)}
main{padding:36px clamp(20px,4vw,56px) 64px;max-width:1180px;width:100%}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px}
.page-head h2{font-size:clamp(26px,3vw,36px);font-weight:800}
.page-head p{color:var(--muted);margin-top:4px}
.back{background:none;border:0;color:var(--muted);cursor:pointer;margin-bottom:10px;font-weight:600}
.back:hover{color:var(--gold-soft)}

/* content */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.room{position:relative;text-align:left;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:border-color .2s,transform .2s}
.room::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(242,182,50,.18),transparent 70%)}
.room:hover{border-color:var(--gold-deep);transform:translateY(-2px)}
.room h3{font-size:21px}
.room small{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px}
.panel h3{font-size:19px;margin-bottom:16px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 18px}
.item .ico{flex:none;width:44px;height:44px;border-radius:10px;background:var(--teal);color:var(--gold-soft);display:grid;place-items:center}
.item .ico svg{width:22px;height:22px}
.item .meta{flex:1;min-width:0}
.item .meta b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta span{font-size:13px;color:var(--muted)}
.item .acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:var(--r-lg);padding:44px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px;font-family:var(--display)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:14.5px}
th{color:var(--muted);font-weight:500;font-size:13px}
tr:last-child td{border-bottom:0}
td select.input{padding:6px 30px 6px 10px;width:auto}
.row-acts{display:flex;gap:6px;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line);border-radius:var(--r-md);padding:26px;text-align:center;cursor:pointer;color:var(--muted);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--gold);background:rgba(242,182,50,.05)}
.drop b{color:var(--text)}
.bar{height:8px;border-radius:99px;background:var(--ink);overflow:hidden;margin-top:14px;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-deep),var(--gold-soft));transition:width .2s}
.note{font-size:13px;color:var(--muted);margin-top:10px}

/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(3,9,11,.75);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal.wide{max-width:900px}
.modal h3{font-size:21px;margin-bottom:16px}
.modal video{width:100%;border-radius:var(--r-md);background:#000;max-height:66vh}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.check{display:flex;align-items:center;gap:10px;padding:9px 4px;cursor:pointer}
.check input{accent-color:var(--gold);width:17px;height:17px}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--gold);padding:11px 16px;border-radius:var(--r-sm);box-shadow:0 12px 30px -10px #000;animation:pop .2s ease-out}
.toast.error{border-left-color:var(--danger)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);z-index:100}
.splash img{width:120px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5;transform:scale(.96)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:900px){
  #auth-view{grid-template-columns:1fr}
  .auth-brand{padding:32px 24px}.auth-brand .logo-big{width:180px}.auth-brand p{display:none}
  #app-view{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:10px}
  .sidebar .logo{width:64px;margin:0}
  .nav{flex-direction:row;overflow-x:auto;flex:1;min-width:60%}
  .nav button{white-space:nowrap;padding:9px 12px}.nav .group{display:none}
  .me{margin:0;border:0;padding:0;display:flex;align-items:center;gap:10px}.me .email{display:none}
  .item{flex-wrap:wrap}
}

/* password show/hide */
.pw{position:relative}
.pw .input{padding-right:46px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;background:none;border:0;border-radius:var(--r-sm);color:var(--muted);cursor:pointer;transition:color .15s,background .15s}
.pw-toggle:hover{color:var(--gold-soft);background:var(--teal)}
.pw-toggle[aria-pressed="true"]{color:var(--gold)}
.pw-toggle svg{width:19px;height:19px}
.pw-toggle .eye-off{display:none}
.pw-toggle[aria-pressed="true"] .eye-on{display:none}
.pw-toggle[aria-pressed="true"] .eye-off{display:block}

/* assignment slots */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.slot{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .1s}
.slot:hover{border-color:var(--gold-deep);transform:translateY(-2px)}
.slot .k{font-size:12.5px;color:var(--muted);font-weight:600}
.slot h3{font-size:18px}
.slot .d{color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.slot .m{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:20px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.preview{width:100%;height:70vh;border:0;border-radius:var(--r-md);background:#fff}
.preview-img{max-width:100%;border-radius:var(--r-md)}
.slot-meta{display:grid;gap:6px;margin:14px 0 18px;font-size:14px;color:var(--muted)}
.slot-meta b{color:var(--text);font-weight:600}
.slot-filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.slot-filters .tabs{margin:0;min-width:280px}
</style>
</head>

function toast(text, type = "ok") {
  const t = document.createElement("div");
  t.className = "toast " + (type === "error" ? "error" : "");
  t.textContent = text;
  $("#toasts").append(t);
  setTimeout(() => t.remove(), 4200);
}
function modal(html, { wide = false } = {}) {
  const o = document.createElement("div");
  o.className = "overlay";
  o.innerHTML = `<div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  const close = () => o.remove();
  o.addEventListener("mousedown", e => { if (e.target === o) close(); });
  document.body.append(o);
  return { el: o, close };
}
function authError(e) {

document.addEventListener("click", e => {
  const b = e.target.closest(".pw-toggle");
  if (!b) return;
  const input = b.parentElement.querySelector("input");
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  b.setAttribute("aria-pressed", show);
  b.setAttribute("aria-label", show ? "Hide password" : "Show password");
  input.focus();
});

let mode = "login";
function setMode(m) {

  $("#auth-submit").textContent = m === "login" ? "Log in" : "Create account";

$("#auth-submit").onclick = submitAuth;

async function submitAuth() {
  const email = $("#auth-email").value.trim().toLowerCase();
  const pass = $("#auth-pass").value;
  if (!email || !pass) return authMsg("Enter your email and password.");
  const btn = $("#auth-submit");
  btn.disabled = true; authMsg("");
  try {
    if (mode === "register") {
      if (pass !== $("#auth-pass2").value) throw { message: "Passwords don't match." };
      registering = true;
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      const rank = email === FOUNDER_EMAIL ? "Founder" : "Student";
      await setDoc(doc(db, "users", cred.user.uid), {
        email, rank, classrooms: [], isBanned: false, canUpload: false, createdAt: serverTimestamp()
      });
      registering = false;
      await boot(cred.user);
    } else {
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      await boot(cred.user);      // ban check happens inside boot
    }
  } catch (e) {
    registering = false;
    authMsg(authError(e));
  } finally { btn.disabled = false; }
}

async function boot(user) {
  let snap;
  try { snap = await getDoc(doc(db, "users", user.uid)); }
  catch (e) { await signOut(auth); return showAuth(authError(e)); }
  if (!snap.exists()) { await signOut(auth); return showAuth("This account doesn't exist or has been deleted. Contact the Founder if this is a mistake."); }
  const data = snap.data();
  if (data.isBanned === true) { await signOut(auth); return showAuth("Your account has been banned."); }
  me = { uid: user.uid, classrooms: [], canUpload: false, ...data };
  view = "classrooms";
  $("#splash").classList.add("hidden");
  $("#auth-view").classList.add("hidden");
  $("#app-view").classList.remove("hidden");
  $("#me-email").textContent = me.email;
  const chip = $("#me-rank"); chip.textContent = me.rank; chip.className = "chip" + (isFounder() ? " founder" : "");
  buildNav(); render();
}
function showAuth(message) {
  me = null;
  $("#splash").classList.add("hidden");
  $("#app-view").classList.add("hidden");
  $("#auth-view").classList.remove("hidden");
  if (message) authMsg(message);
}
onAuthStateChanged(auth, user => {
  if (registering) return;
  if (user) boot(user); else showAuth();
});
$("#logout").onclick = () => signOut(auth);

function buildNav() {
  const items = [["classrooms", "Classrooms", "book"]];
  if (canUpload()) items.push(["upload", "Upload material", "upload"]);
  if (isFounder()) items.push(["#group", "Founder tools"], ["manage", "Manage classrooms", "room"], ["users", "Users", "users"], ["create", "Create account", "plus"]);
  $("#nav").innerHTML = items.map(([id, label, ic]) => id === "#group"
    ? `<div class="group">${label}</div>`
    : `<button type="button" data-view="${id}" class="${view === id ? "active" : ""}">${svg(ic)}<span>${label}</span></button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.view));
}
function go(v, arg) { view = v; buildNav(); render(arg); }
async function render(arg) {
  const main = $("#main");
  main.innerHTML = '<p class="note">Loading…</p>';
  try {
    if (view === "classrooms") await viewClassrooms(main);
    else if (view === "room") await viewRoom(main, arg);
    else if (view === "slot") await viewSlot(main, arg);
    else if (view === "upload" && canUpload()) await viewUpload(main);
    else if (view === "manage" && isFounder()) await viewManage(main);
    else if (view === "users" && isFounder()) await viewUsers(main);
    else if (view === "create" && isFounder()) viewCreate(main);
    else go("classrooms");
  } catch (e) { main.innerHTML = `<div class="msg error">${esc(authError(e))}</div>`; }
}

/* =====================================================================
   8b. SLOTS — the Founder creates a Homework / Classwork slot in a classroom,
   students upload their work into it. One submission per student per slot
   (uploading again replaces it).
   ===================================================================== */
const SLOT_KINDS = ["Homework", "Classwork"];
const SUB_MAX = 10 * 1024 * 1024;   // 10 MB (Cloudinary free limit for PDFs/images)
const isStudent = () => me?.rank === "Student";
const fmtDue = ms => new Date(ms).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" });
function relTime(ms) {
  const d = ms - Date.now(), a = Math.abs(d);
  const n = a >= 86400000 ? Math.round(a / 86400000) : a >= 3600000 ? Math.round(a / 3600000) : Math.max(1, Math.round(a / 60000));
  const u = a >= 86400000 ? "day" : a >= 3600000 ? "hour" : "min";
  const t = `${n} ${u}${u !== "min" && n !== 1 ? "s" : ""}`;
  return d >= 0 ? `in ${t}` : `${t} ago`;
}
const isLate = (sub, slot) => !!(slot.dueMs && sub.submittedAt?.toMillis && sub.submittedAt.toMillis() > slot.dueMs);
const isPast = slot => !!(slot.dueMs && slot.dueMs < Date.now());
const byNewest = key => (a, b) => (b[key]?.seconds ?? 9e9) - (a[key]?.seconds ?? 9e9);

async function loadSlots(classroomId) {
  const s = await getDocs(query(collection(db, "slots"), where("classroomId", "==", classroomId)));
  return s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNewest("createdAt"));
}
// Staff read every match; a student's query is limited to their own work (matches the rules).
async function loadSubs(field, value) {
  const q = isStaff()
    ? query(collection(db, "submissions"), where(field, "==", value))
    : query(collection(db, "submissions"), where(field, "==", value), where("studentUid", "==", me.uid));
  const s = await getDocs(q);
  return s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNewest("submittedAt"));
}
function slotBadge(slot, mine, count) {
  if (isStaff()) return `<span class="chip">${count} submitted</span>`;
  if (mine) return isLate(mine, slot) ? '<span class="chip banned">Submitted late</span>' : '<span class="chip ok">Submitted</span>';
  if (!slot.dueMs) return '<span class="chip">Open</span>';
  return slot.dueMs > Date.now() ? `<span class="chip">Due ${relTime(slot.dueMs)}</span>` : '<span class="chip banned">Overdue</span>';
}

/* ---- list of slots inside a classroom ---- */

  catch (e) { return main.insertAdjacentHTML("beforeend", `<div class="msg error" style="margin-top:28px">${esc(authError(e))}</div>`); }
  const mineBy = {}, countBy = {};

    $("#slot-grid").innerHTML = rows.length ? rows.map(x => `<button class="slot" type="button" data-id="${x.id}">
        <span class="k">${esc(x.kind)}</span><h3>${esc(x.title)}</h3>

  };
  main.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
    tab = b.dataset.tab; main.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("active", x === b)); paint();
  });
  $("#slot-kind").onchange = paint;
  paint();

  if (isFounder()) $("#slot-new").onclick = () => {
    const md = modal(`<h3>New slot in ${esc(room.name)}</h3>
      <div class="field"><label for="n-kind">Type</label><select class="input" id="n-kind">${SLOT_KINDS.map(k => `<option>${k}</option>`).join("")}</select></div>
      <div class="field"><label for="n-title">Title</label><input class="input" id="n-title" placeholder="HW 7: States of matter, paper 4"></div>
      <div class="field"><label for="n-desc">Instructions (optional)</label><textarea class="input" id="n-desc" rows="3" style="resize:vertical" placeholder="Paper 4, chapter 5: questions 2, 3, 8, 11(a)…"></textarea></div>
      <div class="field"><label for="n-due">Deadline (optional)</label><input class="input" id="n-due" type="datetime-local"></div>
      <div class="foot"><button class="btn" type="button" id="n-cancel">Cancel</button><button class="btn primary" type="button" id="n-go">Create slot</button></div>`);
    $("#n-cancel", md.el).onclick = md.close;

      const title = $("#n-title", md.el).value.trim(), due = $("#n-due", md.el).value, btn = $("#n-go", md.el);

/* ---- one slot: student uploads / staff review ---- */
function filePreview(x) {
  const t = x.fileType || "";
  if (t === "application/pdf" || /\.pdf$/i.test(x.fileName || "")) return `<iframe class="preview" src="${esc(x.url)}" title="Submitted file"></iframe>`;
  if (t.startsWith("image/")) return `<img class="preview-img" src="${esc(x.url)}" alt="Submitted file">`;
  return `<div class="empty"><b>${esc(x.fileName || "Your file")}</b>This file type can't be previewed here. Use Open or Download.</div>`;
}

  main.innerHTML = `<button class="back" type="button" id="back">← ${esc(room.name)}</button><div class="split" id="split"></div>`;

  if (isStaff()) {

      try {

        missing = us.docs.map(d => ({ uid: d.id, ...d.data() })).filter(u => u.rank === "Student" && !u.isBanned && (u.classrooms || []).includes(room.id) && !done.has(u.uid)).map(u => u.email).sort();

    $("#split").innerHTML = `<section class="panel"><h3 style="margin-bottom:14px">Submissions (${subs.length})</h3><div class="list" id="sub-list"></div></section>
      <aside class="panel">${info}
        ${isFounder() ? `<h3 style="font-size:16px;margin-bottom:8px">Not submitted yet (${missing.length})</h3>
          <p style="color:var(--muted);font-size:14px;margin-bottom:18px">${missing.length ? missing.map(esc).join("<br>") : "Everyone enrolled has submitted."}</p>
          <button class="btn danger" type="button" id="slot-del">Delete slot</button>` : ""}</aside>`;
    $("#sub-list").innerHTML = subs.length ? subs.map(x => `<div class="item"><div class="ico">${svg(kindOf(x) === "pdf" ? "pdf" : "file")}</div>
      <div class="meta"><b>${esc(x.studentEmail)}</b><span>${x.submittedAt ? fmtDue(x.submittedAt.toMillis()) : "Just now"}${x.size ? " · " + fmtSize(x.size) : ""} ${isLate(x, slot) ? '<span class="chip banned">Late</span>' : ""}</span></div>
      <div class="acts"><a class="btn small primary" href="${esc(x.url)}" target="_blank" rel="noopener">Open</a>
        <a class="btn small" href="${esc(x.url)}" target="_blank" rel="noopener" download>Download</a>
        ${isFounder() ? `<button class="btn small danger" type="button" data-del="${x.id}">Delete</button>` : ""}</div></div>`).join("")
      : `<div class="empty"><b>No submissions yet</b>Work will appear here as students upload it.</div>`;
    $("#sub-list").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      const x = subs.find(y => y.id === b.dataset.del);
      if (!confirm(`Delete the submission from ${x.studentEmail}?`)) return;
      try { await deleteDoc(doc(db, "submissions", x.id)); toast("Deleted"); render(arg); } catch (e) { toast(authError(e), "error"); }
    });
    $("#slot-del")?.addEventListener("click", async () => {
      if (!confirm(`Delete "${slot.title}" and every submission in it? This can't be undone.`)) return;
      try {
        for (const x of subs) await deleteDoc(doc(db, "submissions", x.id));
        await deleteDoc(doc(db, "slots", slot.id));
        toast("Slot deleted"); go("room", room);
      } catch (e) { toast(authError(e), "error"); }
    });
    return;
  }

  /* ---------- student view ---------- */
  const late = isPast(slot);
  $("#split").innerHTML = `<section class="panel"><h3 style="margin-bottom:14px">${esc(me.email)} · ${mine ? (isLate(mine, slot) ? "Submitted late" : "Submitted") : "Not submitted"}</h3>
      ${mine ? filePreview(mine) + `<p class="note" style="margin-top:12px">${esc(mine.fileName)} · ${fmtSize(mine.size)} · <a href="${esc(mine.url)}" target="_blank" rel="noopener">Open in new tab</a></p>`
        : `<div class="empty"><b>Not submitted yet</b>Upload your file on the right.</div>`}</section>
    <aside class="panel">${info}
      ${late ? `<div class="msg error">The deadline has passed. You can still upload, but it will be marked late.</div>` : ""}
      <label class="drop" id="sl-drop" for="sl-file"><b id="sl-text">${mine ? "Choose a new file to replace yours" : "Click to upload"}</b><br>or drag and drop. PDF, photo or Word file, up to 10 MB.</label>
      <input type="file" id="sl-file" class="hidden" accept=".pdf,image/*,.doc,.docx">
      <div class="bar hidden" id="sl-bar"><i></i></div>
      <button class="btn primary" type="button" id="sl-go" style="width:100%;margin-top:16px">${mine ? "Replace submission" : "Submit"}</button></aside>`;

  input.onchange = show;
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); input.files = e.dataTransfer.files; show(); };
  $("#sl-go").onclick = async () => {
    const f = input.files[0], btn = $("#sl-go");
    if (!f) return toast("Choose a file first.", "error");
    if (f.size > SUB_MAX) return toast("That file is over 10 MB. Compress it or split it.", "error");
    btn.disabled = true; $("#sl-bar").classList.remove("hidden");
    try {
      const r = await cloudUpload(f, p => { $("#sl-bar i").style.width = (p * 100).toFixed(0) + "%"; });
      // Fixed document id = one submission per student per slot; uploading again replaces it.
      await setDoc(doc(db, "submissions", `${slot.id}_${me.uid}`), {
        slotId: slot.id, slotTitle: slot.title, kind: slot.kind,
        classroomId: room.id, classroomName: room.name,
        studentUid: me.uid, studentEmail: me.email,
        url: r.secure_url, fileName: f.name, fileType: f.type, size: f.size, cloudId: r.public_id,
        submittedAt: serverTimestamp()
      });
      toast("Submitted"); render(arg);
    } catch (e) { btn.disabled = false; toast(authError(e), "error"); }
  };
}

/* =====================================================================
   9. VIEW — upload (Founder + ranks the Founder authorised)
   ===================================================================== */
function cloudUpload(file, onProgress) {
  return new Promise((resolve, reject) => {
    if (CLOUDINARY.cloudName.startsWith("YOUR_")) return reject({ message: "Add your Cloudinary cloud name and upload preset at the top of the script." });
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", CLOUDINARY.uploadPreset);
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/auto/upload`);
    xhr.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
    xhr.onerror = () => reject({ message: "Network problem during upload." });
    xhr.onload = () => {
      let r = {}; try { r = JSON.parse(xhr.responseText); } catch {}
      xhr.status >= 200 && xhr.status < 300 ? resolve(r) : reject({ message: r.error?.message || "Upload failed." });
    };
    xhr.send(fd);
  });
}
function parseLink(u) {
  let url; try { url = new URL(u); } catch { return null; }
  const h = url.hostname.replace(/^www\./, "");
  let id;
  if (h === "youtu.be") id = url.pathname.slice(1);
  else if (h.endsWith("youtube.com")) id = url.searchParams.get("v") || url.pathname.split("/").pop();
  if (id) return { embed: `https://www.youtube.com/embed/${id}` };
  if (h === "drive.google.com") { const m = url.pathname.match(/\/d\/([^/]+)/); if (m) return { embed: `https://drive.google.com/file/d/${m[1]}/preview` }; }
  return {};
}

async function viewUpload(main, preselect) {
  const rooms = await loadClassrooms();
  main.innerHTML = `<div class="page-head"><div><h2>Upload material</h2><p>Add PDFs, worksheets or recorded lessons to a classroom.</p></div></div>`;
  if (!rooms.length) return main.insertAdjacentHTML("beforeend", `<div class="empty"><b>No classrooms yet</b>The Founder needs to create a classroom before files can be added.</div>`);
  main.insertAdjacentHTML("beforeend", `<div class="panel" style="max-width:680px">
    <div class="tabs"><button type="button" id="t-file" class="active">Upload a file</button><button type="button" id="t-link">Paste a link</button></div>
    <div class="form-row">
      <div class="field"><label for="up-room">Classroom</label><select class="input" id="up-room">${rooms.map(r => `<option value="${r.id}" data-name="${esc(r.name)}" ${r.id === preselect ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></div>
      <div class="field"><label for="up-title">Title</label><input class="input" id="up-title" placeholder="Algebra: simultaneous equations"></div>
    </div>
    <div id="pane-file">
      <label class="drop" id="drop" for="up-file"><b id="drop-text">Choose a file</b><br>or drag it here. PDFs, images, short videos.</label>
      <input type="file" id="up-file" class="hidden">
      <div class="bar hidden" id="bar"><i></i></div>
      <p class="note">Free hosting limits: about 100 MB per video and 10 MB per PDF or image. For longer lessons, upload the video to YouTube as Unlisted and use Paste a link.</p>
    </div>
    <div id="pane-link" class="hidden">
      <div class="field"><label for="up-link">Link</label><input class="input" id="up-link" placeholder="https://youtu.be/… or a Google Drive share link"></div>
      <p class="note">YouTube (Unlisted) and Google Drive links play inside the platform. Any other link opens in a new tab.</p>
    </div>
    <div style="margin-top:20px"><button class="btn primary" type="button" id="up-go">Upload</button></div></div>`);
  let tab = "file";
  const setTab = t2 => { tab = t2; $("#t-file").classList.toggle("active", t2 === "file"); $("#t-link").classList.toggle("active", t2 === "link");
    $("#pane-file").classList.toggle("hidden", t2 !== "file"); $("#pane-link").classList.toggle("hidden", t2 !== "link"); $("#up-go").textContent = t2 === "file" ? "Upload" : "Add link"; };
  $("#t-file").onclick = () => setTab("file"); $("#t-link").onclick = () => setTab("link");
  const input = $("#up-file"), drop = $("#drop");
  const show = () => { const f = input.files[0]; $("#drop-text").textContent = f ? `${f.name} (${fmtSize(f.size)})` : "Choose a file"; if (f && !$("#up-title").value) $("#up-title").value = f.name.replace(/\.[^.]+$/, ""); };
  input.onchange = show;
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); input.files = e.dataTransfer.files; show(); };
  $("#up-go").onclick = async () => {
    const title = $("#up-title").value.trim(), sel = $("#up-room").selectedOptions[0], btn = $("#up-go");
    if (!title) return toast("Add a title.", "error");
    const base = { classroomId: sel.value, classroomName: sel.dataset.name, title, uploadedBy: me.uid };
    btn.disabled = true;
    try {
      if (tab === "file") {
        const file = input.files[0];
        if (!file) throw { message: "Choose a file first." };
        $("#bar").classList.remove("hidden");
        const r = await cloudUpload(file, p => { $("#bar i").style.width = (p * 100).toFixed(0) + "%"; });
        await addDoc(collection(db, "materials"), { ...base, url: r.secure_url, fileName: file.name, fileType: file.type, size: file.size, cloudId: r.public_id, createdAt: serverTimestamp() });
      } else {
        const link = $("#up-link").value.trim(), info = parseLink(link);
        if (!info) throw { message: "Enter a valid link starting with https://" };
        await addDoc(collection(db, "materials"), { ...base, url: link, ...(info.embed ? { embed: info.embed } : {}), fileName: "", fileType: info.embed ? "link/video" : "link", createdAt: serverTimestamp() });
      }
      toast("Added"); go("room", { id: sel.value, name: sel.dataset.name });
    } catch (e) { btn.disabled = false; toast(authError(e), "error"); }
  };
}

async function viewManage(main) {
  const rooms = await loadClassrooms();
  main.innerHTML = `<div class="page-head"><div><h2>Manage classrooms</h2><p>Create a classroom, then add students to it from the Users page.</p></div></div>
    <div class="panel" style="max-width:560px;margin-bottom:28px"><h3>New classroom</h3>
      <div class="field"><label for="room-name">Name</label><input class="input" id="room-name" placeholder="Grade 10 Algebra"></div>
      <button class="btn primary" type="button" id="room-add">Create classroom</button></div>
    <div class="list" id="room-list"></div>`;
  const add = async () => {
    const name = $("#room-name").value.trim();
    if (!name) return toast("Enter a classroom name.", "error");
    try { await addDoc(collection(db, "classrooms"), { name, createdBy: me.uid, createdAt: serverTimestamp() }); toast("Classroom created"); render(); }
    catch (e) { toast(authError(e), "error"); }
  };
  $("#room-add").onclick = add;
  $("#room-name").addEventListener("keydown", e => { if (e.key === "Enter") add(); });
  $("#room-list").innerHTML = rooms.length ? rooms.map(r => `<div class="item"><div class="ico">${svg("room")}</div><div class="meta"><b>${esc(r.name)}</b><span>Created ${fmtDate(r.createdAt)}</span></div><div class="acts"><button class="btn small danger" type="button" data-del="${r.id}">Delete</button></div></div>`).join("")
    : `<div class="empty"><b>No classrooms yet</b>Create your first one above.</div>`;
  main.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const r = rooms.find(x => x.id === b.dataset.del);
    if (!confirm(`Delete "${r.name}" and every file inside it? This can't be undone.`)) return;
    try {
      const mats = await loadMaterials(r.id);
      for (const m of mats) await deleteDoc(doc(db, "materials", m.id));
      const subsDel = await getDocs(query(collection(db, "submissions"), where("classroomId", "==", r.id)));
      for (const x of subsDel.docs) await deleteDoc(x.ref);
      const slotsDel = await getDocs(query(collection(db, "slots"), where("classroomId", "==", r.id)));
      for (const x of slotsDel.docs) await deleteDoc(x.ref);
      await deleteDoc(doc(db, "classrooms", r.id));
      toast("Classroom deleted"); render();
    } catch (e) { toast(authError(e), "error"); }
  });
}

async function viewUsers(main) {
  const [snap, rooms] = await Promise.all([getDocs(collection(db, "users")), loadClassrooms()]);
  const users = snap.docs.map(d => ({ uid: d.id, ...d.data() })).sort((a, b) => a.email.localeCompare(b.email));
  main.innerHTML = `<div class="page-head"><div><h2>Users</h2><p>${users.length} accounts. Change ranks, ban or delete accounts, and choose who can upload.</p></div></div>
  <div class="tablewrap"><table><thead><tr><th>Email</th><th>Rank</th><th>Status</th><th>Uploads</th><th>Classrooms</th><th></th></tr></thead><tbody>
  ${users.map(u => {
    const self = u.uid === me.uid, founder = u.rank === "Founder", staff = STAFF.includes(u.rank);
    return `<tr data-uid="${u.uid}"><td>${esc(u.email)}</td>
      <td>${founder ? '<span class="chip founder">Founder</span>' : `<select class="input" data-rank>${RANKS.map(r => `<option ${r === u.rank ? "selected" : ""}>${r}</option>`).join("")}</select>`}</td>
      <td>${u.isBanned ? '<span class="chip banned">Banned</span>' : '<span class="chip ok">Active</span>'}</td>
      <td>${founder ? "Always" : staff ? `<button class="btn small" type="button" data-upload>${u.canUpload ? "Allowed · revoke" : "Allow"}</button>` : "—"}</td>
      <td>${founder ? "All" : `<button class="btn small" type="button" data-enrol>${(u.classrooms || []).length} · edit</button>`}</td>
      <td><div class="row-acts">${self || founder ? "" : `<button class="btn small ${u.isBanned ? "" : "danger"}" type="button" data-ban>${u.isBanned ? "Unban" : "Ban"}</button><button class="btn small" type="button" data-pass>Password</button><button class="btn small danger" type="button" data-delete>Delete</button>`}</div></td></tr>`;
  }).join("")}</tbody></table></div>`;
  const byUid = uid => users.find(u => u.uid === uid);
  const patch = async (uid, data, msg) => { try { await updateDoc(doc(db, "users", uid), data); toast(msg); render(); } catch (e) { toast(authError(e), "error"); } };
  main.querySelectorAll("tr[data-uid]").forEach(tr => {
    const u = byUid(tr.dataset.uid);
    tr.querySelector("[data-rank]")?.addEventListener("change", e => patch(u.uid, { rank: e.target.value, ...(e.target.value === "Student" ? { canUpload: false } : {}) }, `${u.email} is now ${e.target.value}`));
    tr.querySelector("[data-ban]")?.addEventListener("click", () => {
      if (!u.isBanned && !confirm(`Ban ${u.email}? They will be signed out and blocked.`)) return;
      patch(u.uid, { isBanned: !u.isBanned }, u.isBanned ? "Account unbanned" : "Account banned");
    });
    tr.querySelector("[data-pass]")?.addEventListener("click", async () => {
      let temp = null;
      try { const c = await getDoc(doc(db, "credentials", u.uid)); temp = c.exists() ? c.data().tempPassword : null; }
      catch (e) { return toast(authError(e), "error"); }
      const md = modal(`<h3>Password for ${esc(u.email)}</h3>
        ${temp ? `<p style="color:var(--muted);margin-bottom:12px">The temporary password you set when creating this account:</p>
          <div class="field"><input class="input" id="pw-val" value="${esc(temp)}" readonly></div>
          <p class="note">If the student has changed it since, this no longer works. Send a reset email instead.</p>`
        : `<p style="color:var(--muted)">No temporary password is saved for this account. It was self-registered or created before this feature existed. Send a reset email to let the student choose a new one.</p>`}
        <div class="foot"><button class="btn" type="button" id="pw-close">Close</button><button class="btn" type="button" id="pw-reset">Send reset email</button>${temp ? '<button class="btn primary" type="button" id="pw-copy">Copy</button>' : ""}</div>`);
      $("#pw-close", md.el).onclick = md.close;
      $("#pw-copy", md.el)?.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(temp); toast("Copied"); }
        catch { $("#pw-val", md.el).select(); toast("Press Ctrl+C to copy"); }
      });
      $("#pw-reset", md.el).onclick = async () => {
        try { await sendPasswordResetEmail(auth, u.email); toast(`Reset email sent to ${u.email}`); }
        catch (e) { toast(authError(e), "error"); }
      };
    });
    tr.querySelector("[data-delete]")?.addEventListener("click", async () => {
      if (!confirm(`Permanently delete ${u.email}?\n\nTheir profile and every homework/classwork they submitted will be removed, and they will never be able to log in again. This can't be undone.`)) return;
      try {
        // 1. Tombstone first: the rules use it to stop this account from recreating a profile.
        await setDoc(doc(db, "deletedUsers", u.uid), { email: u.email, deletedBy: me.uid, deletedAt: serverTimestamp() });
        // 2. Their submissions.
        const theirs = await getDocs(query(collection(db, "submissions"), where("studentUid", "==", u.uid)));
        for (const x of theirs.docs) await deleteDoc(x.ref);
        // 3. Their profile.
        try { await deleteDoc(doc(db, "credentials", u.uid)); } catch { /* none saved */ }
        await deleteDoc(doc(db, "users", u.uid));
        toast(`${u.email} deleted`); render();
      } catch (e) { toast(authError(e), "error"); }
    });
    tr.querySelector("[data-upload]")?.addEventListener("click", () => patch(u.uid, { canUpload: !u.canUpload }, u.canUpload ? "Upload access removed" : "Upload access granted"));
    tr.querySelector("[data-enrol]")?.addEventListener("click", () => {
      if (!rooms.length) return toast("Create a classroom first.", "error");
      const md = modal(`<h3>Classrooms for ${esc(u.email)}</h3>${rooms.map(r => `<label class="check"><input type="checkbox" value="${r.id}" ${(u.classrooms || []).includes(r.id) ? "checked" : ""}><span>${esc(r.name)}</span></label>`).join("")}
        <div class="foot"><button class="btn" type="button" id="c">Cancel</button><button class="btn primary" type="button" id="s">Save</button></div>`);
      $("#c", md.el).onclick = md.close;
      $("#s", md.el).onclick = async () => {
        const ids = [...md.el.querySelectorAll("input:checked")].map(i => i.value);
        md.close(); patch(u.uid, { classrooms: ids }, "Classrooms updated");
      };
    });
  });
}

function viewCreate(main) {
  main.innerHTML = `<div class="page-head"><div><h2>Create account</h2><p>Add a student, teacher or moderator. You stay signed in.</p></div></div>
    <div class="panel" style="max-width:520px"><div id="cr-msg"></div>
      <div class="field"><label for="cr-email">Email</label><input class="input" id="cr-email" type="email"></div>
      <div class="field"><label for="cr-pass">Temporary password</label><div class="pw"><input class="input" id="cr-pass" type="password" autocomplete="new-password"><button class="pw-toggle" type="button" aria-label="Show password" aria-pressed="false"><svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.5 6.6A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div></div>
      <div class="field"><label for="cr-rank">Rank</label><select class="input" id="cr-rank">${RANKS.map(r => `<option>${r}</option>`).join("")}</select></div>
      <button class="btn primary" type="button" id="cr-go">Create account</button>
      <p class="note">Share the email and password with the person. Passwords need at least 6 characters.</p></div>`;
  $("#cr-go").onclick = async () => {
    const email = $("#cr-email").value.trim().toLowerCase(), pass = $("#cr-pass").value, rank = $("#cr-rank").value;
    const box = $("#cr-msg"), btn = $("#cr-go");
    if (!email || pass.length < 6) return box.innerHTML = '<div class="msg error">Enter an email and a password of at least 6 characters.</div>';
    btn.disabled = true; box.innerHTML = "";
    try {
      let cred;
      try { cred = await createUserWithEmailAndPassword(secondaryAuth, email, pass); }
      catch (e) {
        // Left over from an earlier attempt that created the login but not the profile? Recover it.
        if (e.code !== "auth/email-already-in-use") throw e;
        try { cred = await signInWithEmailAndPassword(secondaryAuth, email, pass); }
        catch { throw new Error("That email already has a login. Use the same password as before, or delete it in Firebase, Authentication, Users, then try again."); }
        if ((await getDoc(doc(db, "users", cred.user.uid))).exists()) { await signOut(secondaryAuth); throw new Error("That account already exists."); }
      }
      // Written from the Founder's own session (the rules allow the Founder to create any profile).
      await setDoc(doc(db, "users", cred.user.uid), { email, rank, classrooms: [], isBanned: false, canUpload: false, createdAt: serverTimestamp() });
      // Founder-only record of the temporary password you chose (see the rules for /credentials).
      await setDoc(doc(db, "credentials", cred.user.uid), { email, tempPassword: pass, setAt: serverTimestamp() });
      await signOut(secondaryAuth);
      box.innerHTML = `<div class="msg ok">Created ${esc(email)} as ${esc(rank)}.</div>`;
      $("#cr-email").value = ""; $("#cr-pass").value = "";
    } catch (e) { box.innerHTML = `<div class="msg error">${esc(authError(e))}</div>`; }
    btn.disabled = false;
  };
}
